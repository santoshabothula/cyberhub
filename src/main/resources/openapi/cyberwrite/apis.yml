info:
  description: "# Overview\n\nThe Cyberwrite API provides access to Cyberwrite\u2019\
    s Cyberprofile\u2122 technology which enables insurers, brokers, and agents to\
    \ manage the cyber insurance risk of small-medium size businesses and to estimate\
    \ the financial impact of a cyber incident on businesses.\n\n# Access Control\
    \ and Authorization\n\nAccess to the API is controlled by API keys issued to customers\
    \ per specific environment. So the key issued for a production environment will\
    \ not grant access to the test environment and vice versa.\n\nEach insurer will\
    \ be authorized to access the API for their resources only based on the insurer\
    \ element of the path. The authorization policy is evaluated based on the match\
    \ between API key, environment, and the insurer element of the path."
  title: Cyberwrite API Reference
  version: v2.0.8
openapi: 3.0.0
paths:
  /insurers/{insurer}/aggregated-risk:
    get:
      description: Get Aggregated Risk Report
      parameters:
      - description: The insurance company ID provided by Cyberwrite.
        example: '{{x-api-name}}'
        in: path
        name: insurer
        required: true
        schema:
          type: string
      - description: API key provided by Cyberwrite
        example: '{{x-api-key}}'
        in: header
        name: x-api-key
        required: true
        schema:
          type: string
      - default: null
        description: Book to filter Reports
        example: null
        in: query
        name: book
        required: false
        schema:
          type: string
      - default: null
        description: Agency ID to filter Reports
        example: null
        in: query
        name: agency
        required: false
        schema:
          type: string
      - default: '1970-01-01'
        description: Filter Reports since this date
        example: '2024-01-01'
        in: query
        name: start_date
        required: false
        schema:
          type: date
      - default: current date
        description: Filter Reports up to this date
        example: '2025-01-01'
        in: query
        name: end_date
        required: false
        schema:
          type: date
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedRiskSchema'
          description: Get Aggregated Risk Report
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        202:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedRiskInProgressSchema'
          description: The insurer aggregated risk data queued for processing
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: The request does not adhere to rules defined by the API
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        401:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: Authorization error (wrong API key or user verification error)
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        403:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: Authorization error (wrong API key or user verification error)
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: The requested resource does not exist
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        405:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: The requested method not allowed
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: 'Error on the server-side (contact: support@cyberwrite.com)'
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
        502:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorSchema'
          description: 'Unreachable backend service (contact: support@cyberwrite.com)'
          headers:
            Content-Type:
              description: application/json
              schema:
                type: string
      summary: Get Aggregated Risk Report
      tags:
      - Aggregated Risk API
