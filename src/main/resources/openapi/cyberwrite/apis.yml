
components:
  schemas:
    APIErrorSchema:
      properties:
        errorMessage:
          title: Errormessage
          type: string
        request_id:
          title: Request Id
          type: string
      required:
      - request_id
      - errorMessage
      title: APIErrorSchema
      type: object
    AgencySchema:
      properties:
        id:
          deprecated: true
          description: Agency ID provided by Cyberwrite
          title: Id
          type: string
        name:
          deprecated: true
          description: Agency name
          title: Name
          type: string
        type:
          deprecated: true
          description: Agency type
          title: Type
          type: string
        website:
          deprecated: true
          description: Agency website
          title: Website
          type: string
      title: AgencySchema
      type: object
    AggregatedRiskAllSchema:
      properties:
        count:
          description: Total amount or Reports
          title: Count
          type: integer
        coverages:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskCoverages'
          description: Aggregated Risk by Coverages
          title: Coverages
        totals:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskTotalsSchema'
          description: Aggregated Risk totals
          title: Totals
      required:
      - totals
      - coverages
      - count
      title: AggregatedRiskAllSchema
      type: object
    AggregatedRiskByBusinessTag:
      properties:
        amount:
          title: Amount
          type: integer
        average_probable_loss:
          format: float
          title: Average Probable Loss
          type: number
        median_risk_score:
          format: float
          title: Median Risk Score
          type: number
        stdev_risk_score:
          format: float
          title: Stdev Risk Score
          type: number
        sum_probable_loss:
          title: Sum Probable Loss
          type: integer
        tag:
          title: Tag
          type: string
      required:
      - tag
      - amount
      - sum_probable_loss
      title: AggregatedRiskByBusinessTag
      type: object
    AggregatedRiskByCoveragesSchema:
      additionalProperties:
        $ref: '#/components/schemas/AggregatedRiskAllSchema'
      title: AggregatedRiskByCoveragesSchema
      type: object
    AggregatedRiskByShortSchema:
      additionalProperties:
        $ref: '#/components/schemas/AggregatedRiskShortSchema'
      title: AggregatedRiskByShortSchema
      type: object
    AggregatedRiskByTinySchema:
      additionalProperties:
        $ref: '#/components/schemas/AggregatedRiskTinySchema'
      title: AggregatedRiskByTinySchema
      type: object
    AggregatedRiskCoverageValues:
      properties:
        monetary_impact:
          title: Monetary Impact
          type: integer
        score_median:
          title: Score Median
          type: integer
        underwriting_score_median:
          format: float
          title: Underwriting Score Median
          type: number
      required:
      - score_median
      - monetary_impact
      title: AggregatedRiskCoverageValues
      type: object
    AggregatedRiskCoverages:
      additionalProperties:
        $ref: '#/components/schemas/AggregatedRiskCoverageValues'
      title: AggregatedRiskCoverages
      type: object
    AggregatedRiskInProgressSchema:
      properties:
        message:
          title: Message
          type: string
        success:
          default: true
          title: Success
          type: boolean
      required:
      - message
      title: AggregatedRiskInProgressSchema
      type: object
    AggregatedRiskSchema:
      properties:
        all:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskAllSchema'
          description: Aggregated Risk Summary
          title: All
        business_tags:
          items:
            $ref: '#/components/schemas/AggregatedRiskByBusinessTag'
          title: Business Tags
          type: array
        by_country:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByCoveragesSchema'
          description: Aggregated Risk by Country
          title: By Country
        by_dns_providers:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByTinySchema'
          description: Aggregated Risk by DNS provider
          title: By Dns Providers
        by_hosting_providers:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByTinySchema'
          description: Aggregated Risk by Hosting provider
          title: By Hosting Providers
        by_isp_providers:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByTinySchema'
          description: Aggregated Risk by ISP provider
          title: By Isp Providers
        by_payment_providers:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByTinySchema'
          description: Aggregated Risk by Payment provider
          title: By Payment Providers
        by_sector:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByCoveragesSchema'
          description: Aggregated Risk by Sector
          title: By Sector
        by_technology:
          additionalProperties:
            type: integer
          description: Aggregated Risk by Technology
          title: By Technology
          type: object
        by_technology_cves:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByShortSchema'
          description: Aggregated Risk by Technology CVE
          title: By Technology Cves
        by_us_state:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskByCoveragesSchema'
          description: Aggregated Risk by US State
          title: By Us State
        stats:
          allOf:
          - $ref: '#/components/schemas/AggregatedRiskStatsSchema'
          description: Reports statistics
          title: Stats
        version:
          default: 3
          description: Aggregated Risk schema version
          title: Version
          type: integer
      title: AggregatedRiskSchema
      type: object
    AggregatedRiskShortSchema:
      properties:
        count:
          description: Total amount or Reports
          title: Count
          type: integer
        max:
          description: Max value
          title: Max
          type: integer
        median:
          description: Median value
          title: Median
          type: integer
        min:
          description: Min value
          title: Min
          type: integer
      required:
      - count
      - min
      - max
      - median
      title: AggregatedRiskShortSchema
      type: object
    AggregatedRiskStatsSchema:
      properties:
        max_date:
          format: date-time
          title: Max Date
          type: string
        median_duration_seconds:
          title: Median Duration Seconds
          type: integer
        min_date:
          format: date-time
          title: Min Date
          type: string
        rejected:
          items:
            $ref: '#/components/schemas/RejectedDataSchema'
          title: Rejected
          type: array
        rejected_count:
          title: Rejected Count
          type: integer
      required:
      - min_date
      - max_date
      - median_duration_seconds
      - rejected_count
      - rejected
      title: AggregatedRiskStatsSchema
      type: object
    AggregatedRiskTinySchema:
      properties:
        count:
          title: Count
          type: integer
        percent:
          title: Percent
          type: integer
      required:
      - count
      - percent
      title: AggregatedRiskTinySchema
      type: object
    AggregatedRiskTotalsSchema:
      properties:
        count:
          title: Count
          type: integer
        industry_median:
          title: Industry Median
          type: integer
        monetary_impact:
          title: Monetary Impact
          type: integer
        monetary_impact_confidence:
          title: Monetary Impact Confidence
          type: integer
        probability_of_breach:
          format: float
          title: Probability Of Breach
          type: number
        probability_of_breach_by_median:
          format: float
          title: Probability Of Breach By Median
          type: number
        score_median:
          title: Score Median
          type: integer
        underwriting_score_median:
          title: Underwriting Score Median
          type: integer
      required:
      - count
      - score_median
      - industry_median
      - underwriting_score_median
      - monetary_impact
      - monetary_impact_confidence
      title: AggregatedRiskTotalsSchema
      type: object
    AlexaViewsByCountry:
      properties:
        country_code:
          description: Two letter country code
          title: Country Code
          type: string
        page_views:
          description: Count of page views of the insured's website per million users
            from a specific country
          title: Page Views
          type: string
        rank:
          description: An estimate of the insured's website popularity in a specific
            country
          title: Rank
          type: integer
        users:
          description: Count of visitors to the insured's website from a specific
            country
          title: Users
          type: string
      title: AlexaViewsByCountry
      type: object
    CollectedDataSchema:
      properties:
        alexa_global_rank:
          description: An estimate of the insured's website popularity
          title: Alexa Global Rank
          type: integer
        alexa_linking_websites_count:
          description: The number of external websites linking to the website of the
            insured
          title: Alexa Linking Websites Count
          type: string
        alexa_page_view_count:
          description: The number of page views per million users of the insured's
            website
          title: Alexa Page View Count
          type: string
        alexa_views_by_country:
          description: The page views of the insured's website by countries
          items:
            $ref: '#/components/schemas/AlexaViewsByCountry'
          title: Alexa Views By Country
          type: array
        alexa_website_loading_time:
          description: The median of the insured's website loading time in milliseconds
          title: Alexa Website Loading Time
          type: string
        anti_ddos_mitigation_implemented:
          description: Implementation of Anti-DDoS mitigation controls
          title: Anti Ddos Mitigation Implemented
          type: boolean
        associated_domains:
          description: Domain names associated with the insured
          items:
            type: string
          title: Associated Domains
          type: array
        business_tags:
          description: Business tag associated with the insured
          items:
            type: string
          title: Business Tags
          type: array
        countries:
          description: Country associated with the insured
          items:
            type: string
          title: Countries
          type: array
        crunchbase_handle:
          description: Insured's handle on Crunchbase
          title: Crunchbase Handle
          type: string
        data_breach_registered_by_cyberwrite:
          description: Count of data breaches associated with the insured as registered
            by Cyberwrite
          title: Data Breach Registered By Cyberwrite
          type: integer
        data_breach_reported_by_insured:
          description: Count of data breaches reported by insured
          title: Data Breach Reported By Insured
          type: boolean
        dmarc_details:
          description: Details of Domain-based Message Authentication, Reporting &
            Conformance (DMARC) record by the insured
          title: Dmarc Details
          type: string
        dmarc_implemented:
          description: Implementation of Domain-based Message Authentication, Reporting
            & Conformance (DMARC) by the insured
          title: Dmarc Implemented
          type: boolean
        email_security_providers:
          description: Email security provider name
          items:
            type: string
          title: Email Security Providers
          type: array
        estimated_annual_revenue:
          description: An estimated annual revenue of the insured
          title: Estimated Annual Revenue
          type: integer
        estimated_market_cap:
          description: An estimated market capitalization of the insured
          title: Estimated Market Cap
          type: integer
        estimated_number_of_employees:
          description: An estimated number of employees of the insured
          title: Estimated Number Of Employees
          type: integer
        facebook_handle:
          description: Insured's handle on Facebook
          title: Facebook Handle
          type: string
        facebook_number_of_followers:
          description: Insured's followers count on Facebook
          title: Facebook Number Of Followers
          type: integer
        glassdoor_average_rating:
          description: Insured's average rating score on Glassdoor
          title: Glassdoor Average Rating
          type: number
        glassdoor_reviews_count:
          description: Insured's review count on Glassdoor
          title: Glassdoor Reviews Count
          type: integer
        google_search_total_results:
          description: Total number of Google search results
          title: Google Search Total Results
          type: integer
        hostnames:
          description: Hostname associated with the insured
          items:
            type: string
          title: Hostnames
          type: array
        identified_technologies:
          allOf:
          - $ref: '#/components/schemas/IdentifiedTechnologiesSchema'
          description: Identified technologies
          example:
            data:
            - domain: domain name
              technologies:
              - description: Technology description
                first_detected: First detected timestamp YYYY-MM-DD HH:MM:SS
                last_detected: Last detected timestamp YYYY-MM-DD HH:MM:SS
                link: Technology manufacturer URL
                name: Technology Name
            total: 25
          title: Identified Technologies
        incidents_date:
          additionalProperties:
            type: integer
          description: Amount of incidents by date
          example:
            1 November 2020: 1
            7 January 2019: 20
          title: Incidents Date
          type: object
        insured_logo_url:
          description: Insured's logo URL
          title: Insured Logo Url
          type: string
        ip_addresses:
          description: IP address associated with the insured
          items:
            $ref: '#/components/schemas/IPAddressSchema'
          title: Ip Addresses
          type: array
        is_open_rdp:
          description: Whether RDP port is open?
          title: Is Open Rdp
          type: boolean
        leaked_clear_text_credentials_count:
          description: Count of exposed clear text credentials associated with the
            insured
          title: Leaked Clear Text Credentials Count
          type: integer
        leaked_hashed_credentials_count:
          description: Count of exposed hashed credentials associated with the insured
          title: Leaked Hashed Credentials Count
          type: integer
        leaked_weak_passwords_count:
          description: Count of exposed weak clear text passwords associated with
            the insured
          title: Leaked Weak Passwords Count
          type: integer
        linkedin_handle:
          description: Insured's handle on LinkedIn
          title: Linkedin Handle
          type: string
        malware_infections_count:
          description: Count of malware infections across the digital assets associated
            with the insured
          title: Malware Infections Count
          type: integer
        malware_infections_description:
          description: Malware infection descriptions
          items:
            $ref: '#/components/schemas/MalwareInfectionsDescriptionSchema'
          title: Malware Infections Description
          type: array
        network_asns:
          description: Network ASN associated with the insured
          items:
            type: string
          title: Network Asns
          type: array
        network_providers:
          allOf:
          - $ref: '#/components/schemas/CoreTechnologiesSchema'
          description: Insured's network providers
          title: Network Providers
        open_ports:
          description: Insured's open ports if detected
          items:
            $ref: '#/components/schemas/OpenPortSchema'
          title: Open Ports
          type: array
        parent_domain:
          description: Insured's website parent domain if detected
          title: Parent Domain
          type: string
        patch_cadence:
          description: Software patching cadence
          title: Patch Cadence
          type: integer
        products_and_services:
          description: Product or service across the digital assets associated with
            the insured
          items:
            type: string
          title: Products And Services
          type: array
        risk_indicators:
          allOf:
          - $ref: '#/components/schemas/RiskIndicatorsSchema'
          description: Risk indicators by name
          title: Risk Indicators
        security_headers:
          allOf:
          - $ref: '#/components/schemas/SecurityHeadersSchema'
          description: Security headers check result
          title: Security Headers
        sic_code:
          description: The Standard Industrial Classification (SIC) code associated
            with the insured
          title: Sic Code
          type: string
        spf_details:
          description: Details of Sender Policy Framework (SPF) record by the insured
          title: Spf Details
          type: string
        spf_implemented:
          description: Implementation of Sender Policy Framework (SPF) by the insured
          title: Spf Implemented
          type: boolean
        ssl_tls_certificates:
          description: Idetified SSL/TLS certificates
          items:
            $ref: '#/components/schemas/SslTlsCertificateSchema'
          title: Ssl Tls Certificates
          type: array
        ssl_tls_implemented:
          description: Implementation of SSL/TLS certificate by the insured
          title: Ssl Tls Implemented
          type: boolean
        ssl_tls_misconfigured:
          description: Shows whether ssl is misconfigured
          title: Ssl Tls Misconfigured
          type: boolean
        ssl_vulnerabilities:
          items:
            type: object
          title: Ssl Vulnerabilities
          type: array
        subdomains:
          items:
            $ref: '#/components/schemas/SubdomainSchema'
          title: Subdomains
          type: array
        ticker_symbol:
          description: A ticker/stock symbol of publicly traded shares associated
            with the insured
          title: Ticker Symbol
          type: string
        torrent_ip_address_count:
          description: A count of distinct organizational IP addresses involved in
            the download and distribution of torrent files
          title: Torrent Ip Address Count
          type: integer
        twitter_followers_count:
          description: Insured's followers count on Twitter
          title: Twitter Followers Count
          type: integer
        twitter_following_count:
          description: Count of profiles the insured is following on Twitter
          title: Twitter Following Count
          type: integer
        twitter_handle:
          description: Insured's handle on Twitter
          title: Twitter Handle
          type: string
        vertical_markets:
          description: Vertical market/sector associated with the insured
          items:
            type: string
          title: Vertical Markets
          type: array
        vulnerable_technologies:
          additionalProperties:
            $ref: '#/components/schemas/VulnerableTechSchema'
          description: Identified vulnerabe technologies
          example:
            Technology Name 1:
              scope:
              - host: some-domain-name.com
                ip_address: null
              vulnerabilities:
              - id: CVE-2020-***
                modified: Modified timestamp YYYY-MM-DD HH:MM:SS
                published: First published timestamp YYYY-MM-DD HH:MM:SS
                score: 6.8
                summary: Details about specific vulnerability
              - id: CVE-2021-***
                modified: Modified timestamp YYYY-MM-DD HH:MM:SS
                published: First published timestamp YYYY-MM-DD HH:MM:SS
                score: 5.2
                summary: Details about specific vulnerability
          title: Vulnerable Technologies
          type: object
        year_founded:
          description: The calendar year in which the insured was first incorporated
            or was first publicly open for business
          title: Year Founded
          type: integer
      required:
      - is_open_rdp
      - risk_indicators
      - subdomains
      title: CollectedDataSchema
      type: object
    CompanySchema:
      properties:
        id:
          description: Insurer ID provided by Cyberwrite
          title: Id
          type: string
        name:
          description: Insurer name
          title: Name
          type: string
        type:
          description: Insurer type
          title: Type
          type: string
        website:
          description: Insurer website
          title: Website
          type: string
      required:
      - id
      - name
      - website
      - type
      title: CompanySchema
      type: object
    CoreTechnologiesSchema:
      properties:
        dns_providers:
          description: Insured's DNS provider
          items:
            type: string
          title: Dns Providers
          type: array
        hosting_providers:
          description: Insured's hosting provider
          items:
            type: string
          title: Hosting Providers
          type: array
        isp_providers:
          description: Insured's ISP provider
          items:
            type: string
          title: Isp Providers
          type: array
        payment_service_providers:
          description: Insured's payment service provider
          items:
            type: string
          title: Payment Service Providers
          type: array
      title: CoreTechnologiesSchema
      type: object
    CoverageSchema:
      properties:
        code:
          description: The coverage code
          title: Code
          type: string
        industry_med_score:
          description: Industry median risk score for a specific coverage
          title: Industry Med Score
          type: integer
        score:
          description: Insured's risk score for a specific coverage
          title: Score
          type: integer
        type:
          description: The coverage name
          title: Type
          type: string
        underwriting_score:
          description: Insured's underwriting score for a specific coverage
          title: Underwriting Score
          type: integer
      title: CoverageSchema
      type: object
    CyberSecurityStandardSchema:
      properties:
        aicpa:
          title: Aicpa
          type: string
        eudpd:
          title: Eudpd
          type: string
        finding_type:
          title: Finding Type
          type: string
        iso_27001:
          title: Iso 27001
          type: string
        iso_27017:
          title: Iso 27017
          type: string
        nist_sp800:
          title: Nist Sp800
          type: string
        pci_dss_v30:
          title: Pci Dss V30
          type: string
        pci_dss_v32:
          title: Pci Dss V32
          type: string
        shared_assesments:
          title: Shared Assesments
          type: string
      required:
      - finding_type
      title: CyberSecurityStandardSchema
      type: object
    GenericStatus:
      description: An enumeration.
      enum:
      - ok
      - warning
      - not_available
      title: GenericStatus
      type: string
    IPAddressSchema:
      properties:
        country:
          description: Geolocation of IP address
          title: Country
          type: string
        ip:
          description: Identified IP address
          title: Ip
          type: string
      required:
      - ip
      title: IPAddressSchema
      type: object
    IdentifiedTechnologiesByDomainSchema:
      properties:
        domain:
          description: Domain where technologies were identified
          title: Domain
          type: string
        technologies:
          description: Identified technologies list
          items:
            $ref: '#/components/schemas/IdentifiedTechnologySchema'
          title: Technologies
          type: array
      required:
      - domain
      - technologies
      title: IdentifiedTechnologiesByDomainSchema
      type: object
    IdentifiedTechnologiesSchema:
      properties:
        data:
          description: Identified technologies by domain list
          items:
            $ref: '#/components/schemas/IdentifiedTechnologiesByDomainSchema'
          title: Data
          type: array
        total:
          description: Total amount of unique identified technologies
          title: Total
          type: integer
      required:
      - total
      - data
      title: IdentifiedTechnologiesSchema
      type: object
    IdentifiedTechnologySchema:
      properties:
        description:
          description: Technology description
          title: Description
          type: string
        first_detected:
          description: First detected timestamp YYYY-MM-DD HH:MM:SS
          title: First Detected
          type: string
        last_detected:
          description: Last detected timestamp YYYY-MM-DD HH:MM:SS
          title: Last Detected
          type: string
        link:
          description: Technology manufacturer URL
          title: Link
          type: string
        name:
          description: Name of identified technology
          title: Name
          type: string
      required:
      - name
      - description
      - link
      - first_detected
      - last_detected
      title: IdentifiedTechnologySchema
      type: object
    ImpactAnalysisCoverageSchema:
      properties:
        code:
          description: The coverage code
          title: Code
          type: string
        coverage_name:
          description: The coverage name
          title: Coverage Name
          type: string
        max:
          description: Maximal monetary loss for a specific coverage
          title: Max
          type: integer
        min:
          description: Minimal monetary loss for a specific coverage
          title: Min
          type: integer
        prob_max:
          description: Maximal probable monetary loss for a specific coverage
          title: Prob Max
          type: integer
        prob_min:
          description: Minimal probable monetary loss for a specific coverage
          title: Prob Min
          type: integer
      title: ImpactAnalysisCoverageSchema
      type: object
    ImpactAnalysisSchema:
      properties:
        coverages:
          items:
            $ref: '#/components/schemas/ImpactAnalysisCoverageSchema'
          title: Coverages
          type: array
        graph_max:
          description: Maximal monetary limit on the graph
          title: Graph Max
          type: integer
        graph_min:
          description: Minimal monetary limit on the graph
          title: Graph Min
          type: integer
        prob_loss_high:
          description: Maximal probable monetary loss
          title: Prob Loss High
          type: integer
        prob_loss_low:
          description: Minimal monetary probable loss
          title: Prob Loss Low
          type: integer
        residual_max_loss:
          title: Residual Max Loss
          type: integer
        total_high:
          description: Total maximal monetary loss
          title: Total High
          type: integer
        total_low:
          description: Total minimal monetary loss
          title: Total Low
          type: integer
        total_prob_high:
          title: Total Prob High
          type: integer
        total_prob_low:
          title: Total Prob Low
          type: integer
        total_prob_xyz_high:
          title: Total Prob Xyz High
          type: integer
        total_prob_xyz_low:
          title: Total Prob Xyz Low
          type: integer
      required:
      - coverages
      title: ImpactAnalysisSchema
      type: object
    InsuredDataSchema:
      properties:
        assigned_id:
          description: Optional assigned report ID
          example: null
          title: Assigned Id
          type: string
        book:
          description: The book the insured is part of
          example: null
          title: Book
          type: string
        country:
          description: Country full name
          example: United States
          title: Country
          type: string
        id:
          description: UUID of the insured as defined in RFC4122
          example: '{{insured-id}}'
          title: Id
          type: string
        name:
          description: Insured name
          example: Company Name
          title: Name
          type: string
        questionnaire_data:
          allOf:
          - $ref: '#/components/schemas/QuestionnaireSchema'
          description: The questionnaire for MIA calculation
          example: null
          title: Questionnaire Data
        report_type:
          default: insured
          deprecated: true
          description: Report type
          title: Report Type
          type: string
        sector:
          description: Sectors of the insured
          items:
            enum:
            - Agriculture
            - Communications
            - Construction
            - Education & Research
            - Financial Services
            - Healthcare
            - Hospitality
            - Industrial
            - Media
            - Mining
            - Other Businesses
            - Public Sector
            - Retail & Wholesale Trade
            - Services
            - Technology
            - Transportation & Automotive
            - Utilities & Energy
            type: string
          title: Sector
          type: array
        security_questionnaire:
          description: The security questionnaire for Residual Risk calculation
          example: null
          items:
            $ref: '#/components/schemas/SecurityQuestionnaire'
